# Cloudflare Pages : site statique dans dist/, Functions dans functions/.
# En production (projet Pages « addictive-shop », branche main), Cloudflare lit ce fichier : liaisons et variables ci-dessous.
# En local (npm run paiement:local), wrangler utilise des copies locales de ces stockages, et .dev.vars remplace [vars].
name = "addictive-shop"
compatibility_date = "2026-11-01"
pages_build_output_dir = "./dist"

# Variables publiques de production. Boutique OUVERTE depuis le 23 novembre 2026, Stripe en mode réel.
# Les secrets (clé Stripe, secret du webhook, signature des liens, jeton Printful) sont dans Cloudflare, jamais ici.
# Retour arrière rapide : CHECKOUT_ENABLED et PUBLIC_BOUTIQUE_OUVERTE à "false" (voir docs/ouverture-paiements.md).
# PUBLIC_BOUTIQUE_OUVERTE est aussi lu par astro.config.mjs à la construction. En local, .dev.vars remplace ces valeurs.
# Version de Node pour la construction : fichier .node-version (Astro 7 demande Node 22.23 ou plus).
[vars]
PUBLIC_BOUTIQUE_OUVERTE = "true"
CHECKOUT_ENABLED = "true"
STRIPE_MODE_REEL = "true"
# Commandes Printful en BROUILLON tant que le premier t-shirt n'a pas été vérifié.
PRINTFUL_CONFIRM_ORDERS = "false"
PRINTFUL_FICHIER_BLASON_NOIR = "id:1110619563"
PRINTFUL_FICHIER_BLASON_BLANC = "id:1110620012"

# Stockages privés (offre gratuite), créés le 13 novembre 2026. Les identifiants ne sont pas secrets.
[[kv_namespaces]]
binding = "FICHIERS"        # les 6 PDF vendus : jamais accessibles par une adresse publique
id = "95519c1efb50445bace07f930e1dc2c0"

[[kv_namespaces]]
binding = "TELECHARGEMENTS" # compteurs et liens déjà utilisés : identifiants seulement, aucune donnée client
id = "4f804dccec1c4580afe25567d7219f55"
